<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ page.title }} | Excel with Eddie</title>
<meta name="description" content="{{ page.description | default: 'Personalized 1-on-1 Excel tutoring for beginners, students, and professionals. Learn formulas, PivotTables, dashboards, automation, and real-world Excel skills with Excel with Eddie.' }}">
<link rel="canonical" href="https://excelwitheddie.com{{ page.url }}">
<link rel="stylesheet" href="/assets/css/style.css">
{% seo %}

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7VLV7WNH6Z"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-7VLV7WNH6Z');
</script>

<style>
/* Floating ExcelBot Launcher */
#excelbot-launcher {
  position: fixed;
  bottom: 120px;
  right: 25px;
  width: 110px;
  cursor: pointer;
  z-index: 9999;
  text-align: center;
}
#excelbot-launcher img {
  width: 100%;
  animation: floatbot 3.2s ease-in-out infinite;
  transition: transform 0.2s;
}
#excelbot-launcher:hover img {
  transform: scale(1.08);
}
#excelbot-launcher .excelbot-label {
  font-size: 13px;
  font-weight: 600;
  color: white;
  background: #083c5a;
  padding: 4px 10px;
  border-radius: 10px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity 0.25s ease;
}
#excelbot-launcher:hover .excelbot-label {
  opacity: 1;
}
@keyframes floatbot {
  0% { transform: translateY(0); }
  50% { transform: translateY(-7px); }
  100% { transform: translateY(0); }
}

/* Page Content */
main.page-content {
  min-height: 60vh;
}
</style>

</head>
<body>

{% include header.html %}

<main class="page-content">
  {{ content }}
</main>

{% include footer.html %}

<!-- Floating ExcelBot Launcher -->
<div id="excelbot-launcher">
  <img src="/assets/images/excelbot.png" alt="ExcelBot">
  <div class="excelbot-label">Ask ExcelBot</div>
</div>

<!-- Floating Book Button -->
<a href="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2Vf9dbUSZeggMTjmT-LvTEKoHceYRjE7B4-OpUQvs6OvDsIcignF-XB6CN_WvoiBAnpME6MbdE"
   class="floating-book-btn"
   target="_blank" rel="noopener">
  Book Now
</a>

<!-- Chatbase Floating Bot Script -->
<script>
(function(){
  const launcher = document.getElementById("excelbot-launcher");

  // Only load Chatbase once
  const loadChatbase = () => {
    if(window.chatbaseLoaded) return;
    window.chatbaseLoaded = true;

    const script = document.createElement("script");
    script.src = "https://www.chatbase.co/embed.min.js";
    script.id = "fkoCrz6CxwPiJEIGA1u3B"; // Your Chatbase Bot ID
    script.domain = "www.chatbase.co";
    document.body.appendChild(script);
  };

  // Load Chatbase when user clicks the launcher
  launcher.addEventListener("click", loadChatbase);
})();
</script>

</body>
</html>
