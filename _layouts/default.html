<!DOCTYPE html>
<html lang="en">
<head>

{% seo %}

<!-- Google Analytics -->

  window.dataLayer = window.dataLayer || [];

<style>
/* Optional: floating Book button styling */
.floating-book-btn {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: #16a085;
  color: white;
  padding: 12px 18px;
  border-radius: 8px;
  font-weight: 600;
  text-decoration: none;
  z-index: 99999;
  box-shadow: 0 6px 12px rgba(0,0,0,0.2);
  transition: transform 0.2s ease;
}
.floating-book-btn:hover { transform: scale(1.05); }
</style>
</head>

<body>

{% include header.html %}

<main class="page-content">
  {{ content }}
</main>

{% include footer.html %}

<!-- Floating Book Button -->
<a href="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2Vf9dbUSZeggMTjmT-LvTEKoHceYRjE7B4-OpUQvs6OvDsIcignF-XB6CN_WvoiBAnpME6MbdE"
   class="floating-book-btn" target="_blank" rel="noopener">
  Book Now
</a>

<!-- Chatbase ExcelBot Embed -->
<script>
(function(){
  if(!window.chatbase || window.chatbase("getState") !== "initialized") {
    window.chatbase = (...args) => {
      if(!window.chatbase.q) window.chatbase.q = [];
      window.chatbase.q.push(args);
    };
    window.chatbase = new Proxy(window.chatbase, {
      get(target, prop) {
        if(prop === "q") return target.q;
        return (...args) => target(prop, ...args);
      }
    });
  }

  const onLoad = function(){
    const script = document.createElement("script");
    script.src = "https://www.chatbase.co/embed.min.js";
    script.id = "fkoCrz6CxwPiJEIGA1u3B"; // Your Chatbase bot ID
    script.domain = "www.chatbase.co";
    document.body.appendChild(script);
  };

  if(document.readyState === "complete") onLoad();
  else window.addEventListener("load", onLoad);
})();
</script>

</body>
</html>
