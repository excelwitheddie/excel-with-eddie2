<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ page.title }} | Excel with Eddie</title>

<link rel="stylesheet" href="/assets/css/style.css">

<style>

/* Hide Chatbase default bubble */
iframe[src*="chatbase"]{
  display:none !important;
}

/* ExcelBot launcher */

#excelbot-launcher{
position:fixed;
bottom:120px;
right:25px;
width:110px;
cursor:pointer;
z-index:9999;
text-align:center;
}

#excelbot-launcher img{
width:100%;
animation:floatbot 3s ease-in-out infinite;
}

@keyframes floatbot{
0%{transform:translateY(0)}
50%{transform:translateY(-8px)}
100%{transform:translateY(0)}
}

.excelbot-label{
font-size:13px;
font-weight:600;
color:white;
background:#083c5a;
padding:4px 10px;
border-radius:10px;
margin-top:6px;
opacity:0;
transition:.25s;
}

#excelbot-launcher:hover .excelbot-label{
opacity:1;
}

</style>

</head>

<body>

{% include header.html %}

<main>
{{ content }}
</main>

{% include footer.html %}


<!-- ExcelBot Launcher -->

<div id="excelbot-launcher">

<img src="/assets/images/excelbot.png" alt="ExcelBot">

<div class="excelbot-label">
Ask ExcelBot
</div>

</div>


<!-- Chatbase Embed -->

<script>

(function(){

if(!window.chatbase || window.chatbase("getState")!=="initialized"){

window.chatbase=(...arguments)=>{
if(!window.chatbase.q){window.chatbase.q=[]}
window.chatbase.q.push(arguments)
}

window.chatbase=new Proxy(window.chatbase,{
get(target,prop){
if(prop==="q"){return target.q}
return(...args)=>target(prop,...args)
}
})

}

const onLoad=function(){

const script=document.createElement("script")

script.src="https://www.chatbase.co/embed.min.js"
script.id="fkoCrz6CxwPiJEIGA1u3B"
script.domain="www.chatbase.co"

document.body.appendChild(script)

}

if(document.readyState==="complete"){
onLoad()
}else{
window.addEventListener("load",onLoad)
}

})()

</script>


<script>

/* Make ExcelBot open the chat */

document.getElementById("excelbot-launcher").addEventListener("click",function(){

const chatButton=document.querySelector("iframe[src*='chatbase']")

if(chatButton){
chatButton.style.display="block"
chatButton.click()
}

})

</script>


</body>
</html>
