<script>
(function initExcelBot(){

  const launcher = document.getElementById("excelbot-launcher");
  const chat = document.getElementById("excelbot-chat");
  const closeBtn = document.getElementById("excelbot-close");
  const input = document.getElementById("excelbot-input");
  const messages = document.getElementById("excelbot-messages");
  const bubble = document.getElementById("excelbotSpeech");

  if(!launcher || !chat || !closeBtn || !input || !messages || !bubble){
    setTimeout(initExcelBot,100);
    return;
  }

  /* ---------------- Speech Bubble ---------------- */

  const bubbleMessages = [
    "Need help fixing an Excel formula?",
    "Confused by a spreadsheet?",
    "Ask me an Excel question!",
    "Stuck in Excel?",
    "I can help with Excel shortcuts!"
  ];

  function showBubble(){
    bubble.textContent =
      bubbleMessages[Math.floor(Math.random()*bubbleMessages.length)];

    bubble.classList.add("show");
    setTimeout(()=>bubble.classList.remove("show"),4000);
  }

  setInterval(showBubble,15000);
  setTimeout(showBubble,4000);

  /* ---------------- Open / Close ---------------- */

  launcher.addEventListener("click",()=>{
    chat.style.display = chat.style.display==="flex" ? "none" : "flex";
  });

  closeBtn.addEventListener("click",()=>{
    chat.style.display="none";
  });

  /* ---------------- Chat API ---------------- */

  async function getExcelAnswer(question){

    try{

      const response = await fetch("/api/chatbase-excel",{
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({question})
      });

      const text = await response.text();

      console.log("ExcelBot API RAW RESPONSE:",text);

      if(!response.ok){
        throw new Error("Server error: "+text);
      }

      if(text.startsWith("<")){
        throw new Error("API returned HTML instead of JSON");
      }

      const data = JSON.parse(text);

      return data.answer || "Sorry, I couldn't find an answer.";

    }catch(err){

      console.error("ExcelBot error:",err);

      return "⚠️ ExcelBot couldn't reach the AI service.";

    }

  }

  /* ---------------- Handle Input ---------------- */

  input.addEventListener("keydown", async (e)=>{

    if(e.key==="Enter" && input.value.trim()!==""){

      const question = input.value.trim();

      const userMsg = document.createElement("div");
      userMsg.className="message-user";
      userMsg.textContent=question;
      messages.appendChild(userMsg);

      const botMsg = document.createElement("div");
      botMsg.className="message-bot";
      botMsg.textContent="Thinking... 🤔";
      messages.appendChild(botMsg);

      messages.scrollTop = messages.scrollHeight;

      input.value="";

      const answer = await getExcelAnswer(question);

      botMsg.textContent = answer;

      messages.scrollTop = messages.scrollHeight;

    }

  });

})();
</script>
