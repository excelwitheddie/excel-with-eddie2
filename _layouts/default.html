<!DOCTYPE html>
<html lang="en">

<head>
<meta name="description" content="{{ page.description }}">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ page.title }} | Excel with Eddie</title>

<link rel="stylesheet" href="/assets/css/style.css">

<style>

/* Hide Chatbase default bubble */
#chatbase-bubble-button{
display:none !important;
}

/* ExcelBot launcher */

#excelbot-launcher{
position:fixed;
bottom:120px;
right:25px;
width:110px;
cursor:pointer;
z-index:9999;
text-align:center;
}

#excelbot-launcher img{
width:100%;
animation:floatbot 3s ease-in-out infinite;
}

@keyframes floatbot{
0%{transform:translateY(0)}
50%{transform:translateY(-8px)}
100%{transform:translateY(0)}
}

/* Hover label */

.excelbot-label{
font-size:13px;
font-weight:600;
color:white;
background:#083c5a;
padding:4px 10px;
border-radius:10px;
margin-top:6px;
opacity:0;
transition:.25s;
}

#excelbot-launcher:hover .excelbot-label{
opacity:1;
}


/* Speech Bubble */

.excelbot-bubble{
position:absolute;
bottom:130px;
right:0;
background:white;
color:#083c5a;
padding:10px 14px;
border-radius:14px;
box-shadow:0 4px 14px rgba(0,0,0,.15);
font-size:14px;
font-weight:500;
width:180px;
opacity:0;
transform:translateY(10px);
transition:all .3s ease;
pointer-events:none;
}

.excelbot-bubble:after{
content:"";
position:absolute;
bottom:-8px;
right:40px;
border-width:8px;
border-style:solid;
border-color:white transparent transparent transparent;
}

.excelbot-bubble.show{
opacity:1;
transform:translateY(0);
}

</style>

</head>


<body>

{% include header.html %}

<main>
{{ content }}
</main>

{% include footer.html %}


<!-- ExcelBot Launcher -->

<div id="excelbot-launcher">

<div class="excelbot-bubble" id="excelbot-bubble">
Need help with Excel?
</div>

<img src="/assets/images/excelbot.png" alt="ExcelBot">

<div class="excelbot-label">
Ask ExcelBot
</div>

</div>


<!-- Chatbase Embed -->

<script>
(function(){

if(!window.chatbase || window.chatbase("getState")!=="initialized"){

window.chatbase=(...arguments)=>{
if(!window.chatbase.q){window.chatbase.q=[]}
window.chatbase.q.push(arguments)
};

window.chatbase=new Proxy(window.chatbase,{
get(target,prop){
if(prop==="q"){return target.q}
return(...args)=>target(prop,...args)
}
});

}

const onLoad=function(){

const script=document.createElement("script");
script.src="https://www.chatbase.co/embed.min.js";
script.id="fkoCrz6CxwPiJEIGA1u3B";
script.domain="www.chatbase.co";

document.body.appendChild(script);

};

if(document.readyState==="complete"){
onLoad();
}else{
window.addEventListener("load",onLoad);
}

})();
</script>


<!-- Bot Interaction + Speech Bubble -->

<script>

document.addEventListener("DOMContentLoaded",function(){

const bot=document.getElementById("excelbot-launcher");
const bubble=document.getElementById("excelbot-bubble");

const excelMessages=[
"Need help fixing an Excel formula?",
"Ask me about PivotTables.",
"Stuck in Excel? I can help.",
"Want to automate a spreadsheet?",
"Need an Excel shortcut?",
"Upload a file and I’ll review it."
];

function showExcelTip(){

const msg=excelMessages[Math.floor(Math.random()*excelMessages.length)];

bubble.textContent=msg;
bubble.classList.add("show");

setTimeout(()=>{
bubble.classList.remove("show");
},4000);

}

/* Show message every 10 seconds */

setInterval(showExcelTip,10000);


/* Bot click opens chat */

if(bot){

bot.addEventListener("click",function(){

bubble.classList.remove("show");

if(window.chatbase){
window.chatbase("open");
}

});

}

});

</script>


</body>
  {% if page.title %}
  <h1 style="display:none;">{{ page.title }}</h1>
{% endif %}
</html>
