<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Page Title -->
  <title>{{ page.title }} | Excel with Eddie</title>

  <!-- Primary Meta Description -->
  <meta name="description" content="{{ page.description | default: 'Personalized 1-on-1 Excel tutoring for beginners, students, and professionals. Learn formulas, PivotTables, dashboards, automation, and real-world Excel skills with Excel with Eddie.' }}">

  <!-- Canonical URL -->
  <link rel="canonical" href="https://excelwitheddie.com{{ page.url }}">

  <!-- Favicons & OG / Twitter tags omitted for brevity -->

  <link rel="stylesheet" href="/assets/css/style.css">

  <!-- Jekyll SEO Tag -->
  {% seo %}

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7VLV7WNH6Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-7VLV7WNH6Z');
  </script>

  <!-- Chatbase JS -->
  <script src="https://www.chatbase.co/embed.min.js" defer></script>

</head>
<body>

  {% include header.html %}

  <main class="page-content">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Floating Book Now Button -->
  <a
    href="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2Vf9dbUSZeggMTjmT-LvTEKoHceYRjE7B4-OpUQvs6OvDsIcignF-XB6CN_WvoiBAnpME6MbdE"
    class="floating-book-btn"
    target="_blank"
    rel="noopener">
    Book Now
  </a>

  <!-- ExcelBot Floating Widget -->
  <div id="excelbot-launcher">
    <div class="excelbot-speech" id="excelbotSpeech">Need help with an Excel formula?</div>
    <img src="/assets/images/excelbot.png" alt="ExcelBot" id="excelbot-img">
    <div class="excelbot-label">Ask ExcelBot</div>
  </div>

  <!-- ExcelBot JS -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const launcher = document.getElementById("excelbot-launcher");
      const bubble = document.getElementById("excelbotSpeech");
      const messages = [
        "Need help fixing an Excel formula?",
        "Confused by a spreadsheet?",
        "Ask me an Excel question!",
        "Stuck in Excel?",
        "I can help with Excel shortcuts!"
      ];

      // Random speech bubble
      function showBubble() {
        bubble.textContent = messages[Math.floor(Math.random()*messages.length)];
        bubble.classList.add("show");
        setTimeout(() => bubble.classList.remove("show"), 4000);
      }

      setInterval(showBubble, 15000);
      setTimeout(showBubble, 4000);

      // Click opens Chatbase iframe or alert fallback
      launcher.addEventListener("click", () => {
        const chatIframe = document.querySelector('iframe[src*="chatbase"]');
        if(chatIframe) {
          chatIframe.contentWindow.postMessage({type:"open"}, "*"); // Chatbase API open
        } else {
          alert("Chatbot ready! You can ask your Excel questions here.");
        }
      });

    });
  </script>

</body>
</html>
