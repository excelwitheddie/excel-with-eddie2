<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{{ page.title }} | Excel with Eddie</title>

<link rel="stylesheet" href="/assets/css/style.css">

<style>

#excelbot-launcher{
position:fixed;
bottom:120px;
right:25px;
width:110px;
cursor:pointer;
z-index:9999;
text-align:center;
}

#excelbot-launcher img{
width:100%;
}

.excelbot-speech{
position:absolute;
right:120px;
bottom:60px;
background:white;
padding:10px 14px;
border-radius:14px;
box-shadow:0 6px 16px rgba(0,0,0,.18);
opacity:0;
transform:translateY(10px);
transition:.4s;
}

.excelbot-speech.show{
opacity:1;
transform:translateY(0);
}

#excelbot-chat{
display:none;
position:fixed;
bottom:150px;
right:25px;
width:300px;
background:white;
border-radius:14px;
box-shadow:0 6px 18px rgba(0,0,0,.25);
flex-direction:column;
z-index:99999;
overflow:hidden;
}

#excelbot-header{
background:#083c5a;
color:white;
padding:10px;
display:flex;
justify-content:space-between;
}

#excelbot-messages{
padding:10px;
max-height:250px;
overflow-y:auto;
}

#excelbot-input{
border:none;
border-top:1px solid #ccc;
padding:8px;
width:100%;
}

.message-bot{
background:#e8f5f2;
padding:6px 10px;
border-radius:8px;
margin-bottom:6px;
}

.message-user{
background:#083c5a;
color:white;
padding:6px 10px;
border-radius:8px;
margin-bottom:6px;
text-align:right;
}

</style>
</head>

<body>

{% include header.html %}

<main>
{{ content }}
</main>

{% include footer.html %}

<!-- ExcelBot Launcher -->

<div id="excelbot-launcher">

<div id="excelbotSpeech" class="excelbot-speech">
Need help with an Excel formula?
</div>

<img src="/assets/images/excelbot.png">

</div>

<!-- Chat Window -->

<div id="excelbot-chat">

<div id="excelbot-header">
ExcelBot
<span id="excelbot-close">✖</span>
</div>

<div id="excelbot-messages"></div>

<input id="excelbot-input" placeholder="Ask me about Excel...">

</div>

<script>

(function initExcelBot(){

const launcher=document.getElementById("excelbot-launcher");
const chat=document.getElementById("excelbot-chat");
const closeBtn=document.getElementById("excelbot-close");
const input=document.getElementById("excelbot-input");
const messages=document.getElementById("excelbot-messages");
const bubble=document.getElementById("excelbotSpeech");

if(!launcher){return;}

const bubbleMessages=[
"Need help fixing an Excel formula?",
"Confused by a spreadsheet?",
"Ask me an Excel question!",
"Stuck in Excel?",
"I can help with Excel shortcuts!"
];

function showBubble(){
bubble.textContent=bubbleMessages[Math.floor(Math.random()*bubbleMessages.length)];
bubble.classList.add("show");
setTimeout(()=>bubble.classList.remove("show"),4000);
}

setInterval(showBubble,15000);
setTimeout(showBubble,4000);

launcher.onclick=()=>{chat.style.display="flex";}
closeBtn.onclick=()=>{chat.style.display="none";}

async function getExcelAnswer(question){

try{

const response=await fetch("/api/chatbase-excel",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({question})
});

const text=await response.text();

console.log("ExcelBot API RAW RESPONSE:",text);

if(text.startsWith("<")){
throw new Error("HTML returned");
}

const data=JSON.parse(text);

return data.answer || "No answer returned.";

}catch(err){

console.error(err);

return "⚠️ ExcelBot couldn't reach the AI service.";

}

}

input.addEventListener("keydown",async(e)=>{

if(e.key==="Enter" && input.value.trim()!==""){

const question=input.value.trim();

const user=document.createElement("div");
user.className="message-user";
user.textContent=question;
messages.appendChild(user);

const bot=document.createElement("div");
bot.className="message-bot";
bot.textContent="Thinking...";
messages.appendChild(bot);

messages.scrollTop=messages.scrollHeight;

input.value="";

const answer=await getExcelAnswer(question);

bot.textContent=answer;

}

});

})();

</script>

</body>
</html>
