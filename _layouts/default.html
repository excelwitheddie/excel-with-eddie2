<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | Excel with Eddie</title>
  <meta name="description" content="{{ page.description | default: 'Personalized 1-on-1 Excel tutoring for beginners, students, and professionals. Learn formulas, PivotTables, dashboards, automation, and real-world Excel skills with Excel with Eddie.' }}">
  <link rel="canonical" href="https://excelwitheddie.com{{ page.url }}">
  <link rel="stylesheet" href="/assets/css/style.css">
  {% seo %}

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7VLV7WNH6Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-7VLV7WNH6Z');
  </script>

  <!-- ExcelBot CSS -->
  <style>
    #excelbot-launcher { position: fixed; bottom: 120px; right: 25px; width: 110px; cursor: pointer; text-align: center; z-index: 9999; }
    #excelbot-launcher img { width: 100%; animation: floatbot 3s ease-in-out infinite; transition: transform 0.2s ease; }
    #excelbot-launcher:hover img { transform: scale(1.08); }
    @keyframes floatbot { 0% {transform: translateY(0);} 50% {transform: translateY(-7px);} 100% {transform: translateY(0);} }
    .excelbot-label { font-size:13px;font-weight:600;color:white;background:var(--blue);padding:4px 10px;border-radius:10px;margin-top:6px;opacity:0;transition:opacity 0.25s ease;}
    #excelbot-launcher:hover .excelbot-label { opacity:1; }
    .excelbot-speech { position:absolute; right:120px; bottom:60px; background:white; color:var(--blue); padding:10px 14px; border-radius:14px; box-shadow:0 6px 16px rgba(0,0,0,0.18); opacity:0; transform:translateY(10px); transition: opacity 0.4s ease, transform 0.4s ease; max-width:180px; font-weight:600; font-size:14px; }
    .excelbot-speech.show { opacity:1; transform:translateY(0); }
    .excelbot-speech::after { content:""; position:absolute; right:-8px; bottom:18px; border-left:8px solid white; border-top:8px solid transparent; border-bottom:8px solid transparent; width:0; height:0; }
    #excelbot-chat { display:none; position:fixed; bottom:150px; right:25px; width:300px; max-width:90%; background:white; border-radius:14px; box-shadow:0 6px 18px rgba(0,0,0,0.25); flex-direction:column; z-index:99999; overflow:hidden; font-family:"Inter",Arial,sans-serif; }
    #excelbot-header { background:var(--blue); color:white; padding:10px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
    #excelbot-header span { cursor:pointer; }
    #excelbot-messages { padding:10px; flex:1; overflow-y:auto; max-height:250px; }
    #excelbot-input { border:none; border-top:1px solid #ccc; padding:8px; font-size:14px; width:100%; outline:none; }
    .message-user { background:var(--blue); color:white; padding:6px 10px; border-radius:8px; margin-bottom:6px; text-align:right; font-size:14px; }
    .message-bot { background:#e8f5f2; padding:6px 10px; border-radius:8px; margin-bottom:6px; font-size:14px; }
  </style>
</head>
<body>

{% include header.html %}
<main class="page-content">{{ content }}</main>
{% include footer.html %}

<!-- ExcelBot Launcher -->
<div id="excelbot-launcher">
  <div class="excelbot-speech" id="excelbotSpeech">Need help with an Excel formula?</div>
  <img src="/assets/images/excelbot.png" alt="ExcelBot">
  <div class="excelbot-label">Ask ExcelBot</div>
</div>

<!-- ExcelBot Chat Modal -->
<div id="excelbot-chat">
  <div id="excelbot-header">ExcelBot <span id="excelbot-close">✖</span></div>
  <div id="excelbot-messages"></div>
  <input type="text" id="excelbot-input" placeholder="Ask me about Excel...">
</div>

<!-- Floating Book Button -->
<a href="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2Vf9dbUSZeggMTjmT-LvTEKoHceYRjE7B4-OpUQvs6OvDsIcignF-XB6CN_WvoiBAnpME6MbdE"
   class="floating-book-btn" target="_blank" rel="noopener">
  Book Now
</a>

<!-- ExcelBot JS -->
<script>
document.addEventListener("DOMContentLoaded", () => {
  const launcher = document.getElementById("excelbot-launcher");
  const chat = document.getElementById("excelbot-chat");
  const closeBtn = document.getElementById("excelbot-close");
  const input = document.getElementById("excelbot-input");
  const messages = document.getElementById("excelbot-messages");
  const bubble = document.getElementById("excelbotSpeech");

  if(!launcher || !chat || !closeBtn || !input || !messages || !bubble){
    console.error("ExcelBot elements missing!");
    return;
  }

  // Floating bubble
  const bubbleMessages = [
    "Need help fixing an Excel formula?",
    "Confused by a spreadsheet?",
    "Ask me an Excel question!",
    "Stuck in Excel?",
    "I can help with Excel shortcuts!"
  ];
  function showBubble(){
    bubble.textContent = bubbleMessages[Math.floor(Math.random()*bubbleMessages.length)];
    bubble.classList.add("show");
    setTimeout(()=>bubble.classList.remove("show"),4000);
  }
  setInterval(showBubble,15000);
  setTimeout(showBubble,4000);

  // Open/close chat
  launcher.addEventListener("click", ()=>chat.style.display = chat.style.display==="none"?"flex":"none");
  closeBtn.addEventListener("click", ()=>chat.style.display="none");

  // AI Bot backend call
  async function getExcelAnswer(question){
    try {
      const res = await fetch("/api/ask-excel", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({question})
      });
      const data = await res.json();
      return data.answer || "Sorry, I couldn't find an answer.";
    } catch(err){
      console.error(err);
      return "Oops! Something went wrong.";
    }
  }

  // Handle user input
  input.addEventListener("keydown", async (e)=>{
    if(e.key==="Enter" && input.value.trim()!==""){
      const question = input.value.trim();

      const userMsg = document.createElement("div");
      userMsg.className="message-user";
      userMsg.textContent=question;
      messages.appendChild(userMsg);

      const botMsg = document.createElement("div");
      botMsg.className="message-bot";
      botMsg.textContent="I’m thinking... 🤔";
      messages.appendChild(botMsg);

      messages.scrollTop = messages.scrollHeight;
      input.value = "";

      const answer = await getExcelAnswer(question);
      botMsg.textContent = answer;
      messages.scrollTop = messages.scrollHeight;
    }
  });
});
</script>

</body>
</html>
