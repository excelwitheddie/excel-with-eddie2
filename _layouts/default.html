<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | Excel with Eddie</title>
  <meta name="description" content="{{ page.description | default: 'Personalized 1-on-1 Excel tutoring for beginners, students, and professionals. Learn formulas, PivotTables, dashboards, automation, and real-world Excel skills with Excel with Eddie.' }}">
  <link rel="canonical" href="https://excelwitheddie.com{{ page.url }}">
  <link rel="stylesheet" href="/assets/css/style.css">
  {% seo %}

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7VLV7WNH6Z"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){ dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-7VLV7WNH6Z');
  </script>

  <style>
    /* ExcelBot styles (same as before) */
    /* ... all your CSS from previous block ... */
  </style>
</head>
<body>

{% include header.html %}
<main class="page-content">{{ content }}</main>
{% include footer.html %}

<!-- ExcelBot Launcher -->
<div id="excelbot-launcher">
  <div class="excelbot-speech" id="excelbotSpeech">Need help with an Excel formula?</div>
  <img src="/assets/images/excelbot.png" alt="ExcelBot">
  <div class="excelbot-label">Ask ExcelBot</div>
</div>

<!-- ExcelBot Chat Modal -->
<div id="excelbot-chat">
  <div id="excelbot-header">ExcelBot <span id="excelbot-close">✖</span></div>
  <div id="excelbot-messages"></div>
  <input type="text" id="excelbot-input" placeholder="Ask me about Excel...">
</div>

<!-- Floating Book Button -->
<a href="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2Vf9dbUSZeggMTjmT-LvTEKoHceYRjE7B4-OpUQvs6OvDsIcignF-XB6CN_WvoiBAnpME6MbdE"
   class="floating-book-btn" target="_blank" rel="noopener">
  Book Now
</a>

<!-- ExcelBot JS -->
<script>
(function initExcelBot(){
  const launcher = document.getElementById("excelbot-launcher");
  const chat = document.getElementById("excelbot-chat");
  const closeBtn = document.getElementById("excelbot-close");
  const input = document.getElementById("excelbot-input");
  const messages = document.getElementById("excelbot-messages");
  const bubble = document.getElementById("excelbotSpeech");

  if(!launcher || !chat || !closeBtn || !input || !messages || !bubble){
    setTimeout(initExcelBot, 100);
    return;
  }

  const bubbleMessages = [
    "Need help fixing an Excel formula?",
    "Confused by a spreadsheet?",
    "Ask me an Excel question!",
    "Stuck in Excel?",
    "I can help with Excel shortcuts!"
  ];

  function showBubble(){
    bubble.textContent = bubbleMessages[Math.floor(Math.random()*bubbleMessages.length)];
    bubble.classList.add("show");
    setTimeout(()=>bubble.classList.remove("show"),4000);
  }

  setInterval(showBubble,15000);
  setTimeout(showBubble,4000);

  launcher.addEventListener("click", ()=>chat.style.display = chat.style.display==="none"?"flex":"none");
  closeBtn.addEventListener("click", ()=>chat.style.display="none");

  async function getExcelAnswer(question){
    try {
      const res = await fetch("/api/chatbase-excel", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ question })
      });
      const data = await res.json();
      return data.answer || "Sorry, I couldn't find an answer.";
    } catch(err){
      console.error(err);
      return "Oops! Something went wrong.";
    }
  }

  input.addEventListener("keydown", async (e)=>{
    if(e.key==="Enter" && input.value.trim()!==""){
      const question=input.value.trim();

      const userMsg=document.createElement("div");
      userMsg.className="message-user";
      userMsg.textContent=question;
      messages.appendChild(userMsg);

      const botMsg=document.createElement("div");
      botMsg.className="message-bot";
      botMsg.textContent="I’m thinking... 🤔";
      messages.appendChild(botMsg);

      messages.scrollTop=messages.scrollHeight;
      input.value="";

      const answer = await getExcelAnswer(question);
      botMsg.textContent = answer;
      messages.scrollTop=messages.scrollHeight;
    }
  });

})();
</script>

</body>
</html>
