<script>
document.addEventListener("DOMContentLoaded", () => {

  const launcher = document.getElementById("excelbot-launcher");
  const chat = document.getElementById("excelbot-chat");
  const closeBtn = document.getElementById("excelbot-close");
  const input = document.getElementById("excelbot-input");
  const messages = document.getElementById("excelbot-messages");

  // Floating speech bubble
  const bubble = document.getElementById("excelbotSpeech");
  const bubbleMessages = [
    "Need help fixing an Excel formula?",
    "Confused by a spreadsheet?",
    "Ask me an Excel question!",
    "Stuck in Excel?",
    "I can help with Excel shortcuts!"
  ];
  function showBubble() {
    bubble.textContent = bubbleMessages[Math.floor(Math.random()*bubbleMessages.length)];
    bubble.classList.add("show");
    setTimeout(() => bubble.classList.remove("show"), 4000);
  }
  setInterval(showBubble, 15000);
  setTimeout(showBubble, 4000);

  // Click bot to open chat modal
  launcher.addEventListener("click", () => {
    chat.style.display = chat.style.display === "none" ? "flex" : "none";
  });
  closeBtn.addEventListener("click", () => chat.style.display = "none");

  // Simulated async bot response function
  function getExcelAnswer(question) {
    return new Promise((resolve) => {
      setTimeout(() => {
        // Example logic: simple canned responses
        const lowerQ = question.toLowerCase();
        let answer = "Hmm, I need more info on that Excel question.";
        if (lowerQ.includes("sum")) answer = "You can use =SUM(A1:A10) to sum a range!";
        else if (lowerQ.includes("pivot")) answer = "Try Insert → PivotTable to summarize your data.";
        else if (lowerQ.includes("formula")) answer = "Formulas start with =, e.g., =A1+B1";
        resolve(answer);
      }, 1200); // 1.2s delay to simulate thinking
    });
  }

  // User input
  input.addEventListener("keydown", async (e) => {
    if(e.key === "Enter" && input.value.trim() !== "") {
      const question = input.value.trim();

      // User message
      const userMsg = document.createElement("div");
      userMsg.className = "message-user";
      userMsg.textContent = question;
      messages.appendChild(userMsg);

      // Bot placeholder message
      const botMsg = document.createElement("div");
      botMsg.className = "message-bot";
      botMsg.textContent = "I’m thinking... 🤔";
      messages.appendChild(botMsg);

      messages.scrollTop = messages.scrollHeight;
      input.value = "";

      // Get bot answer asynchronously
      try {
        const answer = await getExcelAnswer(question);
        botMsg.textContent = answer; // Update placeholder with actual answer
        messages.scrollTop = messages.scrollHeight;
      } catch (err) {
        botMsg.textContent = "Oops! Something went wrong.";
        console.error(err);
      }
    }
  });

});
</script>
