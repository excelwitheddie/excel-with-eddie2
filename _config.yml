# =========================
# Excel with Eddie Jekyll Config
# =========================

title: "Excel with Eddie"
description: "I help growing businesses fix broken spreadsheets, automate reporting, and build Excel systems they can trust."
url: "https://excelwitheddie.com"   # Your production URL
baseurl: ""                         # Leave empty unless hosted in a subfolder
author:
  name: "Eddie Hodges"
  email: "contact@excelwitheddie.com"

# =========================
# Plugins
# =========================
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# =========================
# SEO & Sitemap Settings
# =========================
seo:
  title: "Excel with Eddie | Reliable Spreadsheet Solutions"
  description: "I help businesses fix broken spreadsheets, automate reporting, and build Excel systems they can trust."
  canonical: "https://excelwitheddie.com"

# =========================
# Exclude from build (optional)
# =========================
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle

# =========================
# Markdown settings
# =========================
markdown: kramdown
kramdown:
  input: GFM

# =========================
# Defaults for pages
# =========================
defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      author: "Eddie Hodges"

# =========================
# Build settings
# =========================
incremental: false
